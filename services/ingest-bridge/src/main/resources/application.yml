spring:
  application:
    name: ingest-bridge
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: ingest-bridge
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 500
    producer:
      acks: all
      compression-type: lz4
      properties:
        enable.idempotence: true
        linger.ms: 5
        max.in.flight.requests.per.connection: 5
    listener:
      ack-mode: batch
      # one consumer thread per partition is the upper bound; 3 is plenty for Phase 1 volumes
      concurrency: 3

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

tracker:
  devices:
    # OPEN = accept every device (development). ALLOW_LIST = accept only the IDs below,
    # report all others on the device.unknown topic.
    mode: ${TRACKER_DEVICES_MODE:OPEN}
    # Comma-separated list when set through the environment: TRACKER_DEVICES_ALLOWED=359...,860...
    allowed: ${TRACKER_DEVICES_ALLOWED:}
    unknown-report-interval: 10m
  validation:
    max-future-skew: 5m
  topics:
    gateway-positions: traccar.positions
    gateway-events: traccar.events
    positions-raw: positions.raw
    positions-rejected: positions.rejected
    device-events: device.events
    device-unknown: device.unknown

logging:
  level:
    com.vehicletracker: INFO
    org.apache.kafka: WARN
