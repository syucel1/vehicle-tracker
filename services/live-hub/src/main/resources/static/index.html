<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Hub - debug view</title>
<style>
  :root { --ink:#152238; --muted:#5F6F85; --line:#D2D9E1; --blue:#0B4F8A; --ok:#1E8E3E; --bad:#C5221F; --plate:#FFD23F; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 "Segoe UI", system-ui, sans-serif; color: var(--ink); background: #E7EBF0; }
  header { background: var(--blue); color: #fff; padding: 12px 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header input { height: 32px; padding: 0 8px; border: 0; border-radius: 4px; width: 180px; }
  header button { height: 32px; padding: 0 14px; border: 1px solid #fff; border-radius: 4px; background: transparent; color: #fff; font-weight: 600; cursor: pointer; }
  #state { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  #state::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--dot, #999); }
  main { display: grid; grid-template-columns: 1fr 360px; gap: 16px; padding: 16px 20px; }
  section { background: #fff; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  h2 { margin: 0; padding: 10px 14px; font-size: 15px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
  h2 span { color: var(--muted); font-weight: 400; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 7px 12px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  th { background: #F4F6F9; font-size: 12px; color: var(--muted); font-weight: 600; }
  td.num { font-variant-numeric: tabular-nums; }
  tr.flash td { background: #FFF8DB; }
  .uid { font-weight: 600; letter-spacing: .02em; }
  #log { list-style: none; margin: 0; padding: 0; max-height: 70vh; overflow-y: auto; font-size: 13px; }
  #log li { padding: 6px 14px; border-bottom: 1px dashed var(--line); }
  #log time { color: var(--muted); margin-right: 8px; font-variant-numeric: tabular-nums; }
  .empty { padding: 20px 14px; color: var(--muted); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Live Hub debug view</h1>
  <label>Token <input id="token" value="dev-token" autocomplete="off"></label>
  <button id="connect" type="button">Connect</button>
  <span id="state">Disconnected</span>
</header>
<main>
  <section>
    <h2>Devices <span id="count">0</span></h2>
    <table>
      <thead><tr><th>Device</th><th>Protocol</th><th>Latitude</th><th>Longitude</th><th>Speed</th><th>Ignition</th><th>Fix time</th><th>Updated</th></tr></thead>
      <tbody id="devices"><tr><td colspan="8" class="empty">Connect to see devices. Start the simulator if nothing appears.</td></tr></tbody>
    </table>
  </section>
  <section>
    <h2>Messages <span id="rate"></span></h2>
    <ul id="log"></ul>
  </section>
</main>
<script>
(function () {
  "use strict";
  const $ = id => document.getElementById(id);
  const devices = new Map();
  let ws = null, pingTimer = null, received = 0;

  function setState(text, color) { $("state").textContent = text; $("state").style.setProperty("--dot", color); }
  function log(text) {
    const li = document.createElement("li");
    li.innerHTML = `<time>${new Date().toLocaleTimeString("en-GB")}</time>`;
    li.append(text);
    $("log").prepend(li);
    while ($("log").children.length > 200) $("log").lastChild.remove();
  }
  function fmtTime(iso) { return iso ? new Date(iso).toLocaleTimeString("en-GB") : ""; }

  function upsert(p, flash) {
    let row = devices.get(p.deviceUid);
    if (!row) {
      row = document.createElement("tr");
      devices.set(p.deviceUid, row);
      if ($("devices").querySelector(".empty")) $("devices").innerHTML = "";
      $("devices").append(row);
      $("count").textContent = devices.size;
    }
    row.innerHTML = `<td class="uid">${p.deviceUid}</td><td>${p.protocol || ""}</td>
      <td class="num">${p.latitude.toFixed(5)}</td><td class="num">${p.longitude.toFixed(5)}</td>
      <td class="num">${p.speedKph != null ? p.speedKph.toFixed(1) + " km/h" : ""}</td>
      <td>${p.ignition == null ? "" : p.ignition ? "On" : "Off"}</td>
      <td class="num">${fmtTime(p.fixTime)}</td><td class="num">${new Date().toLocaleTimeString("en-GB")}</td>`;
    if (flash) { row.classList.add("flash"); setTimeout(() => row.classList.remove("flash"), 400); }
  }

  function connect() {
    if (ws) { ws.close(); return; }
    const url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws/live";
    ws = new WebSocket(url);
    setState("Connecting", "#C77A00");
    ws.onopen = () => ws.send(JSON.stringify({ type: "auth", token: $("token").value }));
    ws.onmessage = e => {
      const m = JSON.parse(e.data);
      received++;
      switch (m.type) {
        case "ready":
          setState("Connected as " + m.subject, "var(--ok)");
          ws.send(JSON.stringify({ type: "subscribe" }));
          pingTimer = setInterval(() => ws.send(JSON.stringify({ type: "ping" })), 30000);
          break;
        case "snapshot":
          log(`Snapshot: ${m.positions.length} device(s)`);
          m.positions.forEach(p => upsert(p, false));
          break;
        case "positions":
          m.positions.forEach(p => upsert(p, true));
          break;
        case "events":
          m.events.forEach(ev => log(`${ev.deviceUid}: ${ev.type}`));
          break;
        case "error":
          log(`Error ${m.code}: ${m.message}`);
          break;
      }
    };
    ws.onclose = e => {
      clearInterval(pingTimer);
      ws = null;
      $("connect").textContent = "Connect";
      setState(`Disconnected${e.reason ? " (" + e.reason + ")" : ""}`, "var(--bad)");
    };
    $("connect").textContent = "Disconnect";
  }

  setInterval(() => { $("rate").textContent = received ? `${received} received` : ""; }, 1000);
  $("connect").onclick = connect;
  connect();
})();
</script>
</body>
</html>
